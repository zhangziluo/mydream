<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写作工具 · Markdown</title>

<link rel="stylesheet" href="style.css">

<!--
  marked：唯一的 CDN 依赖（Markdown → HTML）。
  注意：锁定 4.3.0 —— 该版本在 npm 包根目录提供 marked.min.js（UMD，
  挂载 window.marked）；marked 新版已移除根目录文件，裸地址会 404。
  如无法访问 jsDelivr，可换成任意 marked 4.x 的镜像源。
-->
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>

<!-- ================= 密码登录遮罩 ================= -->
<div id="authOverlay">
  <form class="auth-card" id="authForm" autocomplete="off">
    <div class="auth-icon">✎</div>
    <h1>写作工具</h1>
    <p>请输入访问密码</p>
    <input type="password" id="authInput" placeholder="密码" autocomplete="current-password">
    <button type="submit">进入</button>
    <div id="authError"></div>
  </form>
</div>

<!-- ================= 主应用（解锁后显示） ================= -->
<div id="app" class="hidden">

  <header class="topbar">
    <div class="brand"><span class="brand-name">写作工具</span></div>
    <div class="spacer"></div>

    <label class="tpl-label" for="tplSelect">模板</label>
    <select id="tplSelect" title="切换预览模板">
      <option value="minimal">极简</option>
      <option value="magazine">杂志风</option>
      <option value="code">代码风</option>
      <option value="dream">梦</option>
      <option value="murmur">梦呓</option>
      <option value="wake">醒</option>
    </select>

    <button type="button" id="mobileToggle" class="btn">👁 预览</button>
    <button type="button" id="publishBtn" class="btn" title="发布到主页">📤 发布</button>
    <button type="button" id="manageBtn" class="btn" title="管理已发布文章">🗂 已发布</button>
    <button type="button" id="openFileBtn" class="btn" title="打开本地 .md/.txt 文件或已发布文章">📂 打开文件</button>
    <button type="button" id="exportBtn" class="btn primary">⬇ 导出 HTML</button>
  </header>

  <main class="workspace">

    <!-- 左侧：编辑器 -->
    <section class="pane editorPane">
      <div class="pane-tools" id="toolbar">
        <button class="tool-btn" data-cmd="undo" title="撤销" type="button">↺</button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-cmd="h1" title="一级标题" type="button">H1</button>
        <button class="tool-btn" data-cmd="h2" title="二级标题" type="button">H2</button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-cmd="bold" title="加粗" type="button"><b>B</b></button>
        <button class="tool-btn" data-cmd="italic" title="斜体" type="button"><i>I</i></button>
        <button class="tool-btn" data-cmd="strike" title="删除线" type="button"><s>S</s></button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-cmd="quote" title="引用" type="button">❝ 引用</button>
        <button class="tool-btn" data-cmd="ul" title="无序列表" type="button">• 列表</button>
        <button class="tool-btn" data-cmd="ol" title="有序列表" type="button">1. 列表</button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-cmd="code" title="行内代码" type="button">&lt;/&gt;</button>
        <button class="tool-btn" data-cmd="pre" title="代码块" type="button">代码块</button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-cmd="link" title="插入链接" type="button">🔗 链接</button>
        <button class="tool-btn" data-cmd="image" title="插入图片" type="button">🖼 图片</button>
        <button class="tool-btn" data-cmd="hr" title="分割线" type="button">───</button>
        <span id="wordCount">0 字</span>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="在这里写 Markdown…"></textarea>
    </section>

    <!-- 右侧：实时预览（沙箱 iframe，样式与导出文件一致） -->
    <section class="pane previewPane">
      <div class="pane-head">
        <span>预览</span>
        <span id="previewHint"></span>
      </div>
      <iframe id="previewFrame" title="实时预览" sandbox="allow-same-origin"></iframe>
    </section>

  </main>
</div>

<!-- ================= 发布对话框 ================= -->
<div id="publishModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="publishTitle">
  <div class="modal-mask" data-close="1"></div>
  <form class="modal-card" id="publishForm" autocomplete="off">
    <h2 id="publishTitle">发布到主页</h2>
    <p class="modal-sub">正文将渲染为单文件 HTML，发布到站点对应板块（梦 / 梦呓 / 醒）。<br>发布密码仅在本浏览器内用于签名，不会明文上传。</p>

    <label class="field">
      <span class="field-label">分类</span>
      <select id="pubCategory">
        <option value="dream">梦</option>
        <option value="murmur">梦呓</option>
        <option value="awake">醒</option>
      </select>
    </label>

    <label class="field">
      <span class="field-label">标题</span>
      <input type="text" id="pubTitle" maxlength="80" placeholder="默认取首行标题，可修改">
    </label>

    <label class="field">
      <span class="field-label">发布密码</span>
      <input type="password" id="pubPassword" placeholder="请输入发布密码">
    </label>

    <div id="pubEditHint" class="pub-edit-hint hidden"></div>

    <label class="pub-new-field hidden" id="pubNewField">
      <input type="checkbox" id="pubNewPost">
      <span>另存为新文章（不覆盖原文，发布为新的一篇）</span>
    </label>

    <div id="pubError" class="modal-error"></div>

    <div class="modal-actions">
      <button type="button" class="btn" data-close="1">取消</button>
      <button type="submit" class="btn primary" id="pubSubmit">发布</button>
    </div>
  </form>
</div>

<!-- ================= 发布管理对话框 ================= -->
<div id="manageModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="manageTitle">
  <div class="modal-mask" data-close-manage="1"></div>
  <div class="modal-card manage-card">
    <h2 id="manageTitle">已发布文章</h2>
    <p class="modal-sub">管理发布到主页的文章。删除需验证发布密码。</p>

    <div id="manageList" class="manage-list">
      <div class="manage-empty">加载中……</div>
    </div>

    <label class="field">
      <span class="field-label">发布密码（删除时使用）</span>
      <input type="password" id="managePassword" placeholder="请输入发布密码" autocomplete="off">
    </label>

    <div id="manageError" class="modal-error"></div>

    <div class="modal-actions">
      <button type="button" class="btn" data-close-manage="1">关闭</button>
    </div>
  </div>
</div>

<!-- ================= 打开文件对话框 ================= -->
<div id="openFileModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="openFileTitle">
  <div class="modal-mask" data-close-open="1"></div>
  <div class="modal-card openfile-card">
    <h2 id="openFileTitle">打开文件</h2>
    <p class="modal-sub">从本地选择 Markdown / 纯文本文件，或打开一篇已发布文章继续编辑。</p>

    <div class="openfile-section">
      <span class="field-label">本地文件</span>
      <button type="button" class="btn openfile-local" id="openFilePickBtn">🗎 选择本地 .md / .txt 文件</button>
      <input type="file" id="localFileInput" accept=".md,.txt,text/markdown,text/plain" hidden>
    </div>

    <div class="openfile-section">
      <span class="field-label">已发布文章 · 点「打开」载入编辑器</span>
      <div id="openFileList" class="manage-list">
        <div class="manage-empty">加载中……</div>
      </div>
    </div>

    <div id="openFileError" class="modal-error"></div>

    <div class="modal-actions">
      <button type="button" class="btn" data-close-open="1">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

</body>
</html>
