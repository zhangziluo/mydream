<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mydream OS · 梦之桌面</title>
<meta name="description" content="延续 Mydream 渐变体系的网页版桌面操作系统：可拖拽图标、iframe 应用窗口、任务栏与时钟/天气/待办挂件。">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1834">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="梦OS">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= 壁纸：深蓝 → 晨曦 → 亮黄 ================= -->
<div id="wallpaper" aria-hidden="true">
  <div class="wp-sky"></div>
  <div class="wp-glow"></div>
  <div class="wp-hills"></div>
  <div id="stars"></div>
  <div class="wp-vignette"></div>
</div>

<!-- ================= 桌面工作区 ================= -->
<main id="desktop" aria-label="桌面">
  <div id="iconLayer"></div>
  <section id="windowsLayer" aria-live="polite"></section>
  <div id="widgetLayer"></div>
  <noscript>
    <p class="noscript">本桌面系统依赖 JavaScript 运行，请开启后刷新。</p>
  </noscript>
</main>

<!-- ================= 开始菜单 ================= -->
<div id="startMenu" role="dialog" aria-label="开始菜单" hidden>
  <div class="menu-head">
    <span class="menu-brand">✧ 梦之桌面</span>
    <input id="menuSearch" type="search" placeholder="搜索应用…" autocomplete="off">
  </div>
  <div class="menu-body" id="menuGroups"></div>
  <div class="menu-foot">
    <span class="foot-label">挂件</span>
    <label class="chk"><input type="checkbox" data-widget="clock" checked> 时钟</label>
    <label class="chk"><input type="checkbox" data-widget="weather" checked> 天气</label>
    <label class="chk"><input type="checkbox" data-widget="todo" checked> 待办</label>
    <span class="foot-sep"></span>
    <button type="button" id="resetIconsBtn" class="foot-btn">复位图标</button>
    <span class="foot-spacer"></span>
    <button type="button" id="installBtn" class="foot-btn primary" hidden>＋ 安装到主屏幕</button>
  </div>
</div>

<!-- ================= 任务栏 ================= -->
<footer id="taskbar" role="toolbar" aria-label="任务栏">
  <button type="button" id="startBtn" title="开始">✧<span id="startLabel">开始</span></button>
  <div id="taskButtons"></div>
  <div class="tray" id="tray">
    <button type="button" id="trayInstall" title="安装到主屏幕" hidden>⬇</button>
    <div class="tray-clock" id="trayClock"></div>
  </div>
</footer>

<div id="toast" class="toast" role="status"></div>

<script src="js/store.js"></script>
<script src="js/apps.js"></script>
<script src="js/window-manager.js"></script>
<script src="js/taskbar.js"></script>
<script src="js/desktop.js"></script>
<script src="js/widgets.js"></script>
<script src="js/main.js"></script>
</body>
</html>
