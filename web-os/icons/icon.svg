<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0a1834"/>
      <stop offset="0.32" stop-color="#1f4474"/>
      <stop offset="0.58" stop-color="#6a5d74"/>
      <stop offset="0.82" stop-color="#c0803f"/>
      <stop offset="1"    stop-color="#f2c457"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="298" cy="136" r="112" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- 星点 -->
  <g fill="#eef3fb">
    <circle cx="96"  cy="88"  r="3.4" opacity="0.9"/>
    <circle cx="180" cy="300" r="2.6" opacity="0.7"/>
    <circle cx="268" cy="62"  r="2.2" opacity="0.6"/>
    <circle cx="352" cy="176" r="2.4" opacity="0.55"/>
    <circle cx="430" cy="330" r="2.8" opacity="0.6"/>
    <circle cx="150" cy="430" r="2.2" opacity="0.5"/>
    <circle cx="486" cy="460" r="3"   opacity="0.45"/>
    <circle cx="60"  cy="470" r="2.2" opacity="0.35"/>
    <circle cx="420" cy="60"  r="2.2" opacity="0.8"/>
  </g>

  <!-- 月晕 + 月牙（视觉落在夜色一侧，晨光自右下漫上来） -->
  <circle cx="232" cy="204" r="150" fill="#cfe0ff" opacity="0.14"/>
  <circle cx="232" cy="204" r="118" fill="#f4f8ff" mask="url(#crescent)"/>
  <circle cx="232" cy="204" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
</svg>
